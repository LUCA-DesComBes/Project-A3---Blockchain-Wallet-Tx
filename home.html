<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Home</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<hgroup>
				<h1>Main Viewer</h1>
				<p>
					Entrez une adresse de Wallet pour visualiser l'ensemble des
					transactions.
				</p>
			</hgroup>
			<article>
				<section class="first-sect">
					<div>
						<p class="adress-title">Adress Ethereum</p>
						<input type="text" placeholder="0x..." id="ethereum-input" />
						<button id="view-wallet">Voir le Wallet</button>
						<p class="astuce">
							Astuce : essayez l’adresse de Vitalik :
							0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045
						</p>
					</div>
				</section>
                <section class="sec-sect">
                    <h2>Sold ETH</h2>
                    <p>0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045</p>
                    <p class="sold">29.585487 ETH</p>
                </section>
			</article>
		</main>
	</body>
</html>
